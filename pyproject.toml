[project]
name = "hri"
version = "0.1.0"
description = "Hatton Capital relationship intelligence: graph, pre-meeting briefs, quiet-relationship detection"
requires-python = ">=3.11"
dependencies = [
  "anthropic==2.14.0",
  "langgraph==1.2.24",
  "langgraph-checkpoint-postgres==3.2.1",
  "langfuse==5.2.0",
  "mcp==1.30.0",
  "psycopg[binary,pool]==3.3.9",
  "pgvector==0.5.1",
  "fastembed==0.9.1",
  "presidio-analyzer>=2.2",
  "presidio-anonymizer>=2.2",
  "spacy==3.8.18",
  "faker==40.63.0",
  "fastapi==0.165.0",
  "uvicorn[standard]==0.54.0",
  "streamlit==1.67.0",
  "httpx==0.28.1",
  "pydantic==2.14.4",
  "pydantic-settings==2.16.3",
  "pyyaml==6.0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "locust>=2.31"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
