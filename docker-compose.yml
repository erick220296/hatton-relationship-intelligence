# Everything that touches unmasked data runs in these containers ("in-region").
# The only egress is via src/hri/privacy/egress.py to allowlisted hosts.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hri
      POSTGRES_PASSWORD: hri
      POSTGRES_DB: hri
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/hri/graph/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hri"]
      interval: 3s
      retries: 20

  mcp:
    build: .
    command: python -m hri.mcp_server.server
    env_file: .env
    environment:
      DATABASE_URL: postgresql://hri_ro:hri_ro@db:5432/hri   # SELECT-only role
    depends_on: { db: { condition: service_healthy } }
    ports: ["8001:8001"]

  api:
    build: .
    command: uvicorn hri.api.app:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment: &dbenv
      DATABASE_URL: postgresql://hri:hri@db:5432/hri
      MCP_URL: http://mcp:8001/mcp
    depends_on: { db: { condition: service_healthy }, mcp: { condition: service_started } }
    ports: ["8000:8000"]

  ui:
    build: .
    command: streamlit run src/hri/ui/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      API_URL: http://api:8000
    depends_on: [api]
    ports: ["8501:8501"]

  # one-off jobs: `docker compose run --rm app <cmd>`
  app:
    build: .
    profiles: ["tools"]
    env_file: .env
    environment:
      <<: *dbenv
      API_URL: http://api:8000
    volumes:
      - ./data:/app/data
      - ./docs:/app/docs
      - ./evals:/app/evals
    depends_on: { db: { condition: service_healthy } }

volumes:
  pgdata:
